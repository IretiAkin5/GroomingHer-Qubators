services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: her
      POSTGRES_PASSWORD: herlocal
      POSTGRES_DB: groomingher
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U her"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: herlocal
      MINIO_ROOT_PASSWORD: herlocal123
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  web:
    build: ./app
    environment:
      DATABASE_URL: postgres://her:herlocal@db:5432/groomingher
      BETTER_AUTH_SECRET: change-me-local-only
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
