# Build Next.js with Netlify's adapter, including server functions and route handling.
[build]
  base = "app"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/downloads/GroomingHer.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = 'attachment; filename="GroomingHer.apk"'
    Cache-Control = "no-cache"
