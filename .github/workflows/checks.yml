name: Demo checks
on:
  push:
  pull_request:
jobs:
  journeys:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run typecheck
      - name: Production browser journeys
        run: |
          npm run start > /tmp/groomingher-web.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:3000/api/health
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demonstration-previews
          path: app/test-results
